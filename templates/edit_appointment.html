<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Appointment</title>
</head>

<body>

    <h1>Edit Appointment</h1>

    <form method="POST">

        <label>Appointment Number:</label><br>

        <input
            type="text"
            name="appointment_number"
            value="{{ appointment['appointment_number'] }}"
            required
        >

        <br><br>


        <label>Patient:</label><br>

        <select name="patient_id" required>

            {% for patient in patients %}

            <option
                value="{{ patient['id'] }}"
                {% if patient['id'] == appointment['patient_id'] %}
                selected
                {% endif %}
            >

                {{ patient['patient_number'] }} -
                {{ patient['first_name'] }}
                {{ patient['last_name'] }}

            </option>

            {% endfor %}

        </select>

        <br><br>


        <label>Doctor:</label><br>

        <select name="doctor_id" required>

            {% for doctor in doctors %}

            <option
                value="{{ doctor['id'] }}"
                {% if doctor['id'] == appointment['doctor_id'] %}
                selected
                {% endif %}
            >

                {{ doctor['doctor_number'] }} -
                {{ doctor['first_name'] }}
                {{ doctor['last_name'] }}
                ({{ doctor['specialization'] }})

            </option>

            {% endfor %}

        </select>

        <br><br>


        <label>Appointment Date:</label><br>

        <input
            type="date"
            name="appointment_date"
            value="{{ appointment['appointment_date'] }}"
            required
        >

        <br><br>


        <label>Appointment Time:</label><br>

        <input
            type="time"
            name="appointment_time"
            value="{{ appointment['appointment_time'] }}"
            required
        >

        <br><br>


        <label>Reason for Visit:</label><br>

        <textarea
            name="reason"
            rows="4"
            cols="40"
        >{{ appointment['reason'] }}</textarea>

        <br><br>


        <label>Status:</label><br>

        <select name="status" required>

            <option
                value="Scheduled"
                {% if appointment['status'] == 'Scheduled' %}selected{% endif %}
            >
                Scheduled
            </option>

            <option
                value="Completed"
                {% if appointment['status'] == 'Completed' %}selected{% endif %}
            >
                Completed
            </option>

            <option
                value="Cancelled"
                {% if appointment['status'] == 'Cancelled' %}selected{% endif %}
            >
                Cancelled
            </option>

        </select>

        <br><br>

        <button type="submit">
            Update Appointment
        </button>

    </form>

    <br>

    <a href="{{ url_for('view_appointment', appointment_id=appointment['id']) }}">
        Cancel
    </a>

</body>

</html>
