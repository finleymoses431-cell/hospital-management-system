<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports - Hospital Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f9;
            color: #1f2937;
        }

        .header {
            background: #164e63;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #0f766e;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
        }

        .back:hover {
            background: #115e59;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        .intro {
            margin-bottom: 25px;
        }

        .intro h2 {
            color: #164e63;
            margin-bottom: 8px;
        }

        .intro p {
            color: #6b7280;
        }

        /* Main cards */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
        }

        .icon {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 30px;
            color: #164e63;
            margin-bottom: 6px;
        }

        .card p {
            color: #6b7280;
            font-size: 14px;
        }

        .revenue {
            font-size: 27px;
            font-weight: bold;
            color: #0f766e;
            margin-bottom: 6px;
        }

        /* Sections */

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
        }

        .section h3 {
            color: #164e63;
            margin-bottom: 20px;
            font-size: 19px;
        }

        .report-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .report-item {
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 20px;
            background: #fafafa;
        }

        .report-item strong {
            display: block;
            font-size: 26px;
            color: #164e63;
            margin-bottom: 6px;
        }

        .report-item span {
            color: #6b7280;
            font-size: 14px;
        }

        .warning {
            border-left: 5px solid #f59e0b;
        }

        .danger {
            border-left: 5px solid #dc2626;
        }

        .success {
            border-left: 5px solid #0f766e;
        }

        /* System summary */

        .summary {
            line-height: 1.8;
            color: #4b5563;
        }

        .summary strong {
            color: #164e63;
        }

        /* Footer */

        .footer {
            text-align: center;
            color: #888;
            padding: 25px;
            font-size: 13px;
        }
        .print-btn {
    border: none;
    color: white;
    background: #0f766e;
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    margin-left: 10px;
}

.print-btn:hover {
    background: #115e59;
}

@media print {

    .header {
        background: white;
        color: black;
    }

    .back,
    .print-btn {
        display: none;
    }

    body {
        background: white;
    }

    .card,
    .section {
        box-shadow: none;
        border: 1px solid #ddd;
    }

    .footer {
        display: none;
    }
}

        /* Responsive */

        @media (max-width: 1000px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .report-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .cards,
            .report-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <h1>📊 Hospital Reports</h1>

    <div>
        <a href="{{ url_for('dashboard') }}" class="back">
            ← Dashboard
        </a>

        <button onclick="window.print()" class="print-btn">
            🖨️ Print Report
        </button>
    </div>

</header>

<div class="container">

    <div class="intro">

        <h2>Hospital Management Reports</h2>

        <p>
            Overview of patients, appointments, pharmacy,
            laboratory and hospital operations.
        </p>

    </div>


    <!-- Main Statistics -->

    <div class="cards">

        <!-- Total Patients -->

        <div class="card">

            <div class="icon">👥</div>

            <h3>{{ total_patients }}</h3>

            <p>Total Patients</p>

        </div>


        <!-- Total Doctors -->

        <div class="card">

            <div class="icon">👨‍⚕️</div>

            <h3>{{ total_doctors }}</h3>

            <p>Total Doctors
