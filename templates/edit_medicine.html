<!DOCTYPE html>
<html>
<head>
    <title>Edit Medicine</title>
</head>

<body>

<h1>Edit Medicine</h1>

<form method="POST">

    <label>Medicine Number:</label><br>
    <input type="text"
           name="medicine_number"
           value="{{ medicine['medicine_number'] }}"
           required>

    <br><br>

    <label>Medicine Name:</label><br>
    <input type="text"
           name="medicine_name"
           value="{{ medicine['medicine_name'] }}"
           required>

    <br><br>

    <label>Category:</label><br>
    <input type="text"
           name="category"
           value="{{ medicine['category'] or '' }}">

    <br><br>

    <label>Quantity:</label><br>
    <input type="number"
           name="quantity"
           value="{{ medicine['quantity'] }}"
           min="0"
           required>

    <br><br>

    <label>Unit Price:</label><br>
    <input type="number"
           name="unit_price"
           value="{{ medicine['unit_price'] }}"
           step="0.01"
           min="0">

    <br><br>

    <label>Expiry Date:</label><br>
    <input type="date"
           name="expiry_date"
           value="{{ medicine['expiry_date'] or '' }}">

    <br><br>

    <label>Supplier:</label><br>
    <input type="text"
           name="supplier"
           value="{{ medicine['supplier'] or '' }}">

    <br><br>

    <label>Description:</label><br>
    <textarea name="description"
              rows="4"
              cols="40">{{ medicine['description'] or '' }}</textarea>

    <br><br>

    <button type="submit">Update Medicine</button>

</form>

<br>

<a href="{{ url_for('medicines') }}">Back to Medicines</a>

</body>
</html>
