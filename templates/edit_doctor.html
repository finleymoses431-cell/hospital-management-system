<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Doctor</title>
</head>

<body>

    <h1>Edit Doctor</h1>

    <form method="POST">

        <label>Doctor Number:</label><br>
        <input type="text"
               name="doctor_number"
               value="{{ doctor['doctor_number'] }}"
               required>
        <br><br>

        <label>First Name:</label><br>
        <input type="text"
               name="first_name"
               value="{{ doctor['first_name'] }}"
               required>
        <br><br>

        <label>Last Name:</label><br>
        <input type="text"
               name="last_name"
               value="{{ doctor['last_name'] }}"
               required>
        <br><br>

        <label>Specialization:</label><br>
        <input type="text"
               name="specialization"
               value="{{ doctor['specialization'] }}"
               required>
        <br><br>

        <label>Phone:</label><br>
        <input type="text"
               name="phone"
               value="{{ doctor['phone'] }}"
               required>
        <br><br>

        <label>Email:</label><br>
        <input type="email"
               name="email"
               value="{{ doctor['email'] or '' }}">
        <br><br>

        <label>Department:</label><br>
        <input type="text"
               name="department"
               value="{{ doctor['department'] or '' }}">
        <br><br>

        <button type="submit">Update Doctor</button>

    </form>

    <br>

    <a href="{{ url_for('view_doctor', doctor_id=doctor['id']) }}">
        Cancel
    </a>

</body>

</html>
