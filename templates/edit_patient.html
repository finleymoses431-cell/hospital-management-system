<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Patient</title>
</head>

<body>

    <h1>Edit Patient</h1>

    <form method="POST">

        <label>Patient Number:</label><br>
        <input type="text" name="patient_number"
               value="{{ patient['patient_number'] }}" required>
        <br><br>

        <label>First Name:</label><br>
        <input type="text" name="first_name"
               value="{{ patient['first_name'] }}" required>
        <br><br>

        <label>Last Name:</label><br>
        <input type="text" name="last_name"
               value="{{ patient['last_name'] }}" required>
        <br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="date_of_birth"
               value="{{ patient['date_of_birth'] }}" required>
        <br><br>

        <label>Gender:</label><br>
        <select name="gender" required>
            <option value="Male" {% if patient['gender'] == 'Male' %}selected{% endif %}>
                Male
            </option>

            <option value="Female" {% if patient['gender'] == 'Female' %}selected{% endif %}>
                Female
            </option>
        </select>
        <br><br>

        <label>Phone:</label><br>
        <input type="text" name="phone"
               value="{{ patient['phone'] }}" required>
        <br><br>

        <label>Address:</label><br>
        <input type="text" name="address"
               value="{{ patient['address'] }}">
        <br><br>

        <label>Blood Group:</label><br>
        <select name="blood_group">

            <option value="A+" {% if patient['blood_group'] == 'A+' %}selected{% endif %}>A+</option>
            <option value="A-" {% if patient['blood_group'] == 'A-' %}selected{% endif %}>A-</option>
            <option value="B+" {% if patient['blood_group'] == 'B+' %}selected{% endif %}>B+</option>
            <option value="B-" {% if patient['blood_group'] == 'B-' %}selected{% endif %}>B-</option>
            <option value="O+" {% if patient['blood_group'] == 'O+' %}selected{% endif %}>O+</option>
            <option value="O-" {% if patient['blood_group'] == 'O-' %}selected{% endif %}>O-</option>
            <option value="AB+" {% if patient['blood_group'] == 'AB+' %}selected{% endif %}>AB+</option>
            <option value="AB-" {% if patient['blood_group'] == 'AB-' %}selected{% endif %}>AB-</option>

        </select>

        <br><br>

        <label>Emergency Contact:</label><br>
        <input type="text" name="emergency_contact"
               value="{{ patient['emergency_contact'] }}">
        <br><br>

        <button type="submit">Update Patient</button>

    </form>

    <br>

    <a href="{{ url_for('view_patient', patient_id=patient['id']) }}">
        Cancel
    </a>

</body>
</html>
