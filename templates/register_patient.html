<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Patient - Hospital Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f9;
            min-height: 100vh;
        }

        .header {
            background: #164e63;
            color: white;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #0f766e;
            padding: 10px 16px;
            border-radius: 6px;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h2 {
            color: #164e63;
            margin-bottom: 5px;
        }

        .title p {
            color: #777;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            color: #164e63;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        select,
        textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0f766e;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        .cancel {
            background: #e5e7eb;
            color: #333;
            text-decoration: none;
        }

        .submit {
            background: #0f766e;
            color: white;
        }

        .submit:hover {
            background: #115e59;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>🏥 Hospital Management System</h1>
    <a href="/dashboard" class="back">← Dashboard</a>
</header>

<div class="container">

    <div class="title">
        <h2>Register New Patient</h2>
        <p>Enter the patient's information below.</p>
    </div>

    <div class="form-card">

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <h3 class="section-title">Personal Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" name="first_name" required>
                </div>

                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" name="last_name" required>
                </div>

                <div class="form-group">
                    <label>Date of Birth *</label>
                    <input type="date" name="date_of_birth" required>
                </div>

                <div class="form-group">
                    <label>Gender *</label>

                    <select name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" name="phone" required>
                </div>

                <div class="form-group">
                    <label>Blood Group</label>

                    <select name="blood_group">
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Address</label>
                    <textarea name="address"></textarea>
                </div>

            </div>

            <h3 class="section-title">Emergency Contact</h3>

            <div class="form-grid">

                <div class="form-group full">
                    <label>Emergency Contact</label>
                    <input
                        type="text"
                        name="emergency_contact"
                        placeholder="Name and phone number"
                    >
                </div>

            </div>

            <div class="buttons">

                <a href="/dashboard" class="btn cancel">
                    Cancel
                </a>

                <button type="submit" class="btn submit">
                    Register Patient
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
